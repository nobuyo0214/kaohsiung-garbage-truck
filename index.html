<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查詢高雄市38個行政區的垃圾車停靠地點、時間與資源回收日。">
  <title>高雄市垃圾車查詢系統</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6f8;
      color: #263238;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, #216b49, #409866);
      color: white;
      text-align: center;
      padding: 36px 16px;
    }
    header h1 { margin: 0 0 5px; font-size: 29px; }
    header p { margin: 0; opacity: .95; }
    main {
      max-width: 950px;
      margin: 26px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 22px rgba(0,0,0,.06);
    }
    h2 { margin-top: 0; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px 18px;
    }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select, button {
      font: inherit;
      font-size: 16px;
      border-radius: 8px;
    }
    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #bbc8c0;
      background: white;
      color: #263238;
    }
    input:focus, select:focus {
      outline: 2px solid #83c39f;
      border-color: #267951;
    }
    .hint {
      margin: 6px 0 0;
      color: #647169;
      font-size: 13px;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 19px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: #267951; color: white; }
    .primary:hover:not(:disabled) { background: #195e3d; }
    .secondary { background: #e9f1ec; color: #225d41; }
    .secondary:hover { background: #d5e8da; }
    .notice {
      margin-top: 18px;
      padding: 12px 14px;
      border-left: 4px solid #267951;
      background: #f1f8f3;
      color: #365343;
      border-radius: 4px;
      font-size: 14px;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f4f6f7;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .warning { color: #9b4b11; }
    .results-heading {
      margin: 25px 0 12px;
      font-size: 20px;
    }
    .card {
      border: 1px solid #e0e6e3;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }
    .card h3 {
      margin: 0 0 12px;
      color: #216b49;
      font-size: 18px;
      overflow-wrap: anywhere;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 16px;
      font-size: 14px;
    }
    .detail { margin: 0; overflow-wrap: anywhere; }
    .detail strong { color: #53635a; }
    .card .source { margin-top: 10px; font-size: 12px; color: #69746d; }
    #moreButton { display: block; margin: 18px auto 0; }
    #moreButton[hidden] { display: none; }
    .footer-note { margin-top: 28px; color: #67736b; font-size: 13px; }
    @media (max-width: 620px) {
      main { margin: 12px; padding: 17px; }
      header { padding: 25px 12px; }
      header h1 { font-size: 23px; }
      .form-grid, .detail-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .button-row button { flex: 1; }
    }
  </style>
</head>

<body>

  <main>

    <form id="searchForm">

      <div class="button-row">

    <div class="notice">

    <p id="dataStatus" class="status" role="status">正在讀取 CSV 資料...</p>
    <p id="filterNotice" class="hint warning" aria-live="polite"></p>

    <h2 class="results-heading">搜尋結果</h2>
    <p id="resultStatus" aria-live="polite">載入完成後即可搜尋。</p>
    <div id="results"></div>

    <p class="footer-note">
      資料來源：高雄市政府環境保護局及部分環境部路線整理資料。
      本網站提供資料集的表定停靠時間，非即時垃圾車位置。
      部分行政區資料尚未完整，實際清運資訊請以主管機關公告為準。

  <script>
    const files = [
      { name: "garbage-truck.csv", district: "前鎮區" },
      { name: "sanmin-east.csv", district: "三民區" },
      { name: "sanmin-west.csv", district: "三民區" },
      { name: "lingya.csv", district: "苓雅區" },
      { name: "fengshan-north.csv", district: "鳳山區" },
      { name: "fengshan-south.csv", district: "鳳山區" },
      { name: "zuoying.csv", district: "左營區" },
      { name: "nanzih.csv", district: "楠梓區" },
      { name: "gushan.csv", district: "鼓山區" },
      { name: "renwu.csv", district: "仁武區" },
      { name: "linyuan.csv", district: "林園區" },
      { name: "dashu.csv", district: "大樹區" },
      { name: "dashe.csv", district: "大社區" },
      { name: "qieding.csv", district: "茄萣區" },
      { name: "qianjin.csv", district: "前金區" },
      { name: "yancheng.csv", district: "鹽埕區" },
      { name: "qijin.csv", district: "旗津區" },
      { name: "qiaotou.csv", district: "橋頭區" },
      { name: "yanchao.csv", district: "燕巢區" },
      { name: "alian.csv", district: "阿蓮區" },
      { name: "mituo.csv", district: "彌陀區" },
      { name: "neimen.csv", district: "內門區" },
      { name: "meinong.csv", district: "美濃區" },
      { name: "xinxing.csv", district: "新興區" },
      { name: "gangshan.csv", district: "岡山區" },
      { name: "luzhu.csv", district: "路竹區" },
      { name: "hunei.csv", district: "湖內區" },
      { name: "yongan.csv", district: "永安區" },
      { name: "ziguan.csv", district: "梓官區" },
      { name: "tianliao.csv", district: "田寮區" },
      { name: "qishan.csv", district: "旗山區" },
      { name: "liugui.csv", district: "六龜區" },
      { name: "jiaxian.csv", district: "甲仙區" },
      { name: "niaosong.csv", district: "鳥松區" },
      { name: "xiaogang.csv", district: "小港區" },
      { name: "shanlin.csv", district: "杉林區" },
      { name: "taoyuan.csv", district: "桃源區" },
      { name: "maolin.csv", district: "茂林區" },
      { name: "namaxia.csv", district: "那瑪夏區" }
    ];

    const PAGE_SIZE = 30;
    let truckData = [];
    let loaded = false;
    let currentMatches = [];
    let visibleCount = 0;

    const $ = (id) => document.getElementById(id);

    function clean(value) {
      return String(value == null ? "" : value).trim();
    }

    function normalize(value) {
      return clean(value).normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    }

    function getStartMinute(rawTime) {
      const match = clean(rawTime).match(/([01]?\d|2[0-3]):([0-5]\d)/);
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function matchesWeekday(raw, day) {
      if (!day) return true;
      const text = clean(raw).replace(/\s+/g, "");
      if (!text) return false;
      if (/每日|每天|天天/.test(text)) return true;
      if (/一[至到~～\-]日/.test(text)) return true;
      if (/一[至到~～\-]六/.test(text) && day !== "日") return true;
      return text.includes(day);
    }

    function matchesPeriod(minute, period) {
      if (!period) return true;
      if (minute === null) return false;
      const ranges = {
        morning: [360, 720],
        afternoon: [720, 1020],
        evening: [1020, 1200],
        night: [1200, 1440],
        dawn: [0, 360]
      };
      const range = ranges[period];
      return range ? minute >= range[0] && minute < range[1] : true;
    }

    function loadCSV(file) {
      return new Promise((resolve, reject) => {
        Papa.parse(file.name, {
          download: true,
          header: true,
          skipEmptyLines: "greedy",
          transformHeader: (header) => clean(header).replace(/^\uFEFF/, ""),
          complete: (result) => {
            if (!result.meta.fields || !result.meta.fields.includes("停留地點")) {
              reject(new Error(file.name + " 缺少「停留地點」欄位"));
              return;
            }

            const rows = result.data
              .filter(row => clean(row["停留地點"]) !== "")
              .map(row => {
                const originalDistrict = clean(row["行政區"]);
                const district = originalDistrict === "大寮區"
                  ? "大寮區"
                  : file.district;

                const stopTime = clean(row["停留時間"]);
                return {
                  ...row,
                  searchDistrict: district,
                  sourceFile: file.name,
                  villageName: clean(row["村里"]),
                  recycleDay: clean(row["回收日"]) || clean(row["回收日(星期)"]),
                  garbageDay: clean(row["一般垃圾日"]) ||
                              clean(row["一般垃圾清運日"]),
                  startMinute: getStartMinute(stopTime)
                };
              });

            resolve(rows);
          },
          error: (error) => reject(error)
        });
      });
    }


    
function normalizeTime(value) {
  const text = clean(value).normalize("NFKC");
  const times = [...text.matchAll(
    /([01]?\d|2[0-3]):([0-5]\d)/g
  )].map(m => m[1].padStart(2, "0") + ":" + m[2]);

  return times.join("-");
}

function garbageDayKey(file, zone, car, place, time) {
  return [
    clean(file),
    clean(zone),
    clean(car),
    clean(place).normalize("NFKC"),
    normalizeTime(time)
  ].join("\u001f");
}

function loadGarbageDayMap() {
  return new Promise(resolve => {
    Papa.parse("garbage-days.csv", {
      download: true,
      header: true,
      skipEmptyLines: "greedy",
      transformHeader: h =>
        clean(h).replace(/^\uFEFF/, ""),

      complete: result => {
        const required = [
          "來源檔案", "責任區", "車次",
          "停留地點", "停留時間",
          "一般垃圾日", "官方來源"
        ];

        if (!required.every(c =>
          (result.meta.fields || []).includes(c))) {
          resolve({
            ok: false,
            message: "日期對照表缺少必要欄位"
          });
          return;
        }

        const validFiles = new Set(
          files.map(f => f.name)
        );
        const rules = new Map();
        const conflicts = new Set();
        let skipped = 0;

        // 載入並檢查日期對照規則
        result.data.forEach(row => {
          const file = clean(row["來源檔案"]);
          const zone = clean(row["責任區"]);
          const car = clean(row["車次"]);
          const place = clean(row["停留地點"]);
          const time = normalizeTime(row["停留時間"]);
          const day = clean(row["一般垃圾日"])
            .replace(/[，,\s]/g, "、");
          const url = clean(row["官方來源"]);

          const validDay =
            /^[一二三四五六日](、[一二三四五六日])*$/
              .test(day);

          if (
            !validFiles.has(file) ||
            !zone || !car ||
            !validDay ||
            !url.startsWith("https://") ||
            (!place && time) ||
            (clean(row["停留時間"]) && !time)
          ) {
            skipped++;
            return;
          }

          const key = garbageDayKey(
            file, zone, car, place, time
          );

          if (rules.has(key) &&
              rules.get(key) !== day) {
            conflicts.add(key);
          } else {
            rules.set(key, day);
          }
        });

        conflicts.forEach(key => rules.delete(key));

        // 建立「起始時間」索引
        // 如果同一站點有多個不同停留時段，
        // 不使用起始時間做模糊配對。
        const timeGroups = new Map();

        truckData.forEach(item => {
          const full = normalizeTime(item["停留時間"]);
          const start = full.split("-")[0] || "";
          if (!start) return;

          const key = garbageDayKey(
            item.sourceFile,
            item["責任區"],
            item["車次"],
            item["停留地點"],
            start
          );

          if (!timeGroups.has(key)) {
            timeGroups.set(key, new Set());
          }
          timeGroups.get(key).add(full);
        });

        let matched = 0;
        let added = 0;
        let ambiguous = 0;

        truckData.forEach(item => {
          const file = item.sourceFile;
          const zone = item["責任區"];
          const car = item["車次"];
          const place = item["停留地點"];
          const fullTime = normalizeTime(
            item["停留時間"]
          );
          const start = fullTime.split("-")[0] || "";

          const exactKey = garbageDayKey(
            file, zone, car, place, fullTime
          );

          const startKey = garbageDayKey(
            file, zone, car, place, start
          );

          const placeKey = garbageDayKey(
            file, zone, car, place, ""
          );

          const routeKey = garbageDayKey(
            file, zone, car, "", ""
          );

          let day = "";

          // 1. 完整時間完全符合
          if (rules.has(exactKey)) {
            day = rules.get(exactKey);
          }

          // 2. 起始時間符合，且無歧義
          if (!day && start && rules.has(startKey)) {
            const group = timeGroups.get(startKey);

            if (group && group.size === 1) {
              day = rules.get(startKey);
            } else {
              ambiguous++;
            }
          }

          // 3. 官方已核實該停靠地點
          if (!day && rules.has(placeKey)) {
            day = rules.get(placeKey);
          }

          // 4. 官方已核實整條路線
          if (!day && rules.has(routeKey)) {
            day = rules.get(routeKey);
          }

          if (!day) return;

          matched++;

          // 不覆蓋原始 CSV 已有的日期
          if (!item.garbageDay) {
            item.garbageDay = day;
            added++;
          }
        });

        resolve({
          ok: true,
          rules: rules.size,
          matched,
          added,
          skipped,
          conflicts: conflicts.size,
          ambiguous
        });
      },

      error: () => resolve({
        ok: false,
        message: "無法讀取 garbage-days.csv"
      })
    });
  });
}


    async function loadAllData() {
      const results = await Promise.allSettled(
        files.map(file => loadCSV(file))
      );
      const failedFiles = [];
      const allRows = [];

      results.forEach((result, index) => {
        if (result.status === "fulfilled") {
          allRows.push(...result.value);
        } else {
          failedFiles.push(files[index].name);
        }
      });

      truckData = allRows;
      const mapping = await loadGarbageDayMap();
      loaded = true;
      $("searchButton").disabled = false;
      $("searchButton").textContent = "搜尋垃圾車";

      $("dataStatus").textContent =
        "成功載入 " + (files.length - failedFiles.length) +
        " / " + files.length + " 份 CSV，共 " +
        truckData.length.toLocaleString("zh-TW") + " 筆有效紀錄。";

      if (failedFiles.length > 0) {
        $("dataStatus").textContent +=
          " 載入失敗：" + failedFiles.join("、");
        $("dataStatus").classList.add("warning");
      }

      if (mapping.ok) {
        $("dataStatus").textContent +=
          "｜日期對照表 " + mapping.rules + " 條規則，配對 " +
          mapping.matched + " 筆，新補入 " + mapping.added + " 筆。";
        if (mapping.skipped || mapping.conflicts) {
          $("dataStatus").textContent += " 略過 " + mapping.skipped +
            " 筆，衝突 " + mapping.conflicts + " 條。";
        }
      } else {
        $("dataStatus").textContent += "｜" + mapping.message;
        $("dataStatus").classList.add("warning");
      }
      updateVillages();
      $("resultStatus").textContent = "資料已載入，請輸入條件並按「搜尋垃圾車」。";
    }

    function updateVillages() {
      const district = $("district").value;
      const villageSelect = $("village");
      villageSelect.replaceChildren();

      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = "全部村里";
      villageSelect.appendChild(allOption);

      const villages = [...new Set(
        truckData
          .filter(row => row.searchDistrict === district)
          .map(row => row.villageName)
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "zh-Hant"));

      villages.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        villageSelect.appendChild(option);
      });

      villageSelect.disabled = !loaded || villages.length === 0;
      updateDayNotice();
    }

    function updateDayNotice() {
      const district = $("district").value;
      const type = $("dayType");
      const garbageOption = type.querySelector('option[value="garbage"]');
      const districtRows = truckData.filter(row => row.searchDistrict === district);
      const available = districtRows.filter(row => clean(row.garbageDay));
      if (!loaded) { garbageOption.disabled = true; return; }
      garbageOption.disabled = available.length === 0;
      if (garbageOption.disabled && type.value === "garbage") type.value = "recycle";
      if (!available.length) {
        $("filterNotice").textContent = "此區尚未提供一般垃圾清運日，暫時無法使用該日期篩選。資源回收日不可代替一般垃圾日。";
      } else if (available.length < districtRows.length) {
        $("filterNotice").textContent = "提醒：此區僅 " + available.length +
          " / " + districtRows.length + " 筆有一般垃圾日，星期查詢可能漏掉未補齊的站點。";
      } else {
        $("filterNotice").textContent = "";
      }
    }

    function searchTruck() {
      if (!loaded) return;

      const district = $("district").value;
      const village = $("village").value;
      const keyword = normalize($("keyword").value);
      const dayType = $("dayType").value;
      const weekday = $("weekday").value;
      const period = $("period").value;
      const sortOrder = $("sortOrder").value;

      currentMatches = truckData.filter(item => {
        if (item.searchDistrict !== district) return false;
        if (village && item.villageName !== village) return false;

        const placeAndVillage = normalize(
          clean(item["停留地點"]) + " " + item.villageName
        );
        if (keyword && !placeAndVillage.includes(keyword)) return false;

        const selectedDay = dayType === "garbage"
          ? item.garbageDay
          : item.recycleDay;
        if (!matchesWeekday(selectedDay, weekday)) return false;

        return matchesPeriod(item.startMinute, period);
      });

      currentMatches.sort((a, b) => {
        if (a.startMinute === null) return b.startMinute === null ? 0 : 1;
        if (b.startMinute === null) return -1;
        const difference = a.startMinute - b.startMinute;
        return sortOrder === "desc" ? -difference : difference;
      });

      visibleCount = 0;
      $("results").replaceChildren();
      $("resultStatus").textContent =
        "「" + district + "」找到 " +
        currentMatches.length.toLocaleString("zh-TW") + " 筆資料。";

      updateDayNotice();
      if (currentMatches.length === 0) {
        $("moreButton").hidden = true;
        $("resultStatus").textContent += " 請調整路名、村里、星期或時段。";
        return;
      }

      showMore();
    }

    function addDetail(parent, label, value) {
      const p = document.createElement("p");
      p.className = "detail";

      const strong = document.createElement("strong");
      strong.textContent = label + "：";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(clean(value) || "未提供"));

      parent.appendChild(p);
    }

    function createResultCard(item) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = clean(item["停留地點"]);
      card.appendChild(title);

      const details = document.createElement("div");
      details.className = "detail-grid";

      addDetail(details, "行政區", item.searchDistrict);
      addDetail(details, "停留時間", item["停留時間"]);
      addDetail(details, "村里", item.villageName);
      addDetail(details, "車次", item["車次"]);
      addDetail(details, "資源回收日", item.recycleDay);
      addDetail(details, "一般垃圾日", item.garbageDay);

      card.appendChild(details);

      if (["taoyuan.csv", "maolin.csv", "namaxia.csv", "shanlin.csv"]
          .includes(item.sourceFile)) {
        const source = document.createElement("div");
        source.className = "source";
        source.textContent = "註：此筆來自環境部路線資料整理版本。";
        card.appendChild(source);
      }

      return card;
    }

    function showMore() {
      const nextRows = currentMatches.slice(
        visibleCount, visibleCount + PAGE_SIZE
      );
      const fragment = document.createDocumentFragment();

      nextRows.forEach(row => {
        fragment.appendChild(createResultCard(row));
      });
      $("results").appendChild(fragment);

      visibleCount += nextRows.length;
      $("moreButton").hidden = visibleCount >= currentMatches.length;
      $("moreButton").textContent =
        "顯示更多（剩下 " +
        (currentMatches.length - visibleCount).toLocaleString("zh-TW") +
        " 筆）";

      $("resultStatus").textContent =
        "找到 " + currentMatches.length.toLocaleString("zh-TW") +
        " 筆，已顯示 " + visibleCount.toLocaleString("zh-TW") + " 筆。";
    }

    function resetFilters() {
      $("keyword").value = "";
      $("village").value = "";
      $("dayType").value = "recycle";
      $("weekday").value = "";
      $("period").value = "";
      $("sortOrder").value = "asc";
      updateDayNotice();

      $("results").replaceChildren();
      $("moreButton").hidden = true;
      $("resultStatus").textContent =
        "已清除篩選條件。可輸入路名或直接按「搜尋垃圾車」。";
    }

    $("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      searchTruck();
    });
    $("district").addEventListener("change", () => {
      updateVillages();
      resetFilters();
    });
    $("dayType").addEventListener("change", updateDayNotice);
    $("weekday").addEventListener("change", updateDayNotice);
    $("resetButton").addEventListener("click", resetFilters);
    $("moreButton").addEventListener("click", showMore);

    loadAllData();
  </script>
</body>
</html>
