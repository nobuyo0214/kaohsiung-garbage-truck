
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄市垃圾車查詢系統</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f3f6f8;
  font-family: Arial, sans-serif;
  color: #222;
}

header {
  background: #377b55;
  color: white;
  padding: 40px 15px;
  text-align: center;
}

main {
  max-width: 800px;
  margin: 35px auto;
  padding: 24px;
  background: white;
  border-radius: 12px;
}

select, input, button {
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
}

select, input {
  width: 100%;
  border: 1px solid #aaa;
  margin: 8px 0 16px;
}

button {
  background: #377b55;
  color: white;
  border: none;
  cursor: pointer;
  padding: 12px 25px;
}

button:hover {
  background: #25623d;
}

.card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 15px;
  margin-top: 12px;
}

.card p { margin: 8px 0; }
small { color: #666; }
</style>
</head>

<body>
<header>
  <h1>高雄市垃圾車查詢系統</h1>
  <p>快速查詢垃圾車路線與清運時間</p>
</header>

<main>
  <h2>垃圾車路線查詢</h2>

  <label for="district">選擇行政區：</label>
  <select id="district">
    <option value="前鎮區">前鎮區</option>
    <option value="三民區">三民區</option>
    <option value="苓雅區">苓雅區</option>
    <option value="鳳山區">鳳山區</option>
    <option value="左營區">左營區</option>
    <option value="楠梓區">楠梓區</option>
    <option value="鼓山區">鼓山區</option>
    <option value="仁武區">仁武區</option>
    <option value="林園區">林園區</option>
    <option value="大樹區">大樹區</option>
    <option value="大社區">大社區</option>
    <option value="茄萣區">茄萣區</option>
    <option value="大寮區">大寮區</option>
    <option value="前金區">前金區</option>
    <option value="鹽埕區">鹽埕區</option>
    <option value="旗津區">旗津區</option>
    <option value="橋頭區">橋頭區</option>
    <option value="燕巢區">燕巢區</option>
    <option value="阿蓮區">阿蓮區</option>
    <option value="彌陀區">彌陀區</option>
    <option value="內門區">內門區</option>
    <option value="美濃區">美濃區</option>
    <option value="新興區">新興區</option>
    <option value="岡山區">岡山區</option>
    <option value="路竹區">路竹區</option>
    <option value="湖內區">湖內區</option>
    <option value="永安區">永安區</option>
    <option value="梓官區">梓官區</option>
    <option value="田寮區">田寮區</option>
    <option value="旗山區">旗山區</option>
    <option value="六龜區">六龜區</option>
    <option value="甲仙區">甲仙區</option>
    <option value="鳥松區">鳥松區</option>
    <option value="小港區">小港區</option>
    <option value="杉林區">杉林區</option>
  </select>

  <label for="keyword">街道或停靠地點：</label>
  <input id="keyword" placeholder="例如：瑞隆路、建工路">

  <button id="searchButton"
          onclick="searchTruck()" disabled>
    資料載入中...
  </button>

  <p id="status">正在讀取政府資料...</p>

  <div id="results"></div>

  <p><small>
    資料來源：高雄市政府環境保護局。
    本網站顯示資料集中的停靠時間，
    非即時車輛位置。實際清運資訊以官方公告為準。
  </small></p>
</main>

<script>
let truckData = [];
let loaded = false;

const files = [
  { name: "garbage-truck.csv", district: "前鎮區" },
  { name: "sanmin-east.csv", district: "三民區" },
  { name: "sanmin-west.csv", district: "三民區" },
  { name: "lingya.csv", district: "苓雅區" },
  { name: "fengshan-north.csv", district: "鳳山區" },
  { name: "fengshan-south.csv", district: "鳳山區" },
  { name: "zuoying.csv", district: "左營區" },
  { name: "nanzih.csv", district: "楠梓區" },
  { name: "gushan.csv", district: "鼓山區" },
  { name: "renwu.csv", district: "仁武區" },
  { name: "linyuan.csv", district: "林園區" },
  { name: "dashu.csv", district: "大樹區" },
  { name: "dashe.csv", district: "大社區" },
  { name: "qieding.csv", district: "茄萣區" },
  { name: "qianjin.csv", district: "前金區" },
  { name: "yancheng.csv", district: "鹽埕區" },
  { name: "qijin.csv", district: "旗津區" },
  { name: "qiaotou.csv", district: "橋頭區" },
  { name: "yanchao.csv", district: "燕巢區" },
  { name: "alian.csv", district: "阿蓮區" },
  { name: "mituo.csv", district: "彌陀區" },
  { name: "neimen.csv", district: "內門區" },
  { name: "meinong.csv", district: "美濃區" },
  { name: "xinxing.csv", district: "新興區" },
  { name: "gangshan.csv", district: "岡山區" },
  { name: "luzhu.csv", district: "路竹區" },
  { name: "hunei.csv", district: "湖內區" },
  { name: "yongan.csv", district: "永安區" },
  { name: "ziguan.csv", district: "梓官區" },
  { name: "tianliao.csv", district: "田寮區" },
  { name: "qishan.csv", district: "旗山區" },
  { name: "liugui.csv", district: "六龜區" },
  { name: "jiaxian.csv", district: "甲仙區" },
  { name: "niaosong.csv", district: "鳥松區" },
  { name: "xiaogang.csv", district: "小港區" },
  { name: "shanlin.csv", district: "杉林區" }
];


function loadCSV(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file.name, {
      download: true,
      header: true,
      skipEmptyLines: "greedy",

      complete: function(result) {
        const rows = result.data
          .filter(row => row["停留地點"])
          .map(row => {

            // 讀取 CSV 原本的行政區
            const originalDistrict =
              (row["行政區"] || "").trim();

            // 預設使用檔案指定的行政區
            let district = file.district;

            // 把混入的 212 筆大寮區資料分開
            if (originalDistrict === "大寮區") {
              district = "大寮區";
            }

            return {
              ...row,
              searchDistrict: district,
              sourceFile: file.name
            };
          });

        resolve(rows);
      },

      error: function(error) {
        reject(error);
      }
    });
  });
}

async function loadAllData() {
  const status = document.getElementById("status");

  const results = await Promise.allSettled(
    files.map(file => loadCSV(file))
  );

  let failedFiles = [];

  results.forEach((result, index) => {
    if (result.status === "fulfilled") {
      truckData.push(...result.value);
    } else {
      failedFiles.push(files[index].name);
    }
  });

  loaded = true;

  const button = document.getElementById("searchButton");
  button.disabled = false;
  button.textContent = "查詢垃圾車";

  status.textContent =
    "已載入 " + truckData.length + " 筆資料";

  if (failedFiles.length > 0) {
    status.textContent +=
      "；載入失敗：" + failedFiles.join("、");
  }
}

function searchTruck() {
  const district =
    document.getElementById("district").value;

  const keyword =
    document.getElementById("keyword").value.trim();

  const status = document.getElementById("status");
  const results = document.getElementById("results");

  results.replaceChildren();

  if (!loaded) {
    status.textContent = "資料尚未載入完成";
    return;
  }

  if (!keyword) {
    status.textContent = "請先輸入街道或停靠地點";
    return;
  }

  const matches = truckData.filter(item =>
    item.searchDistrict === district &&
    (item["停留地點"] || "").includes(keyword)
  );

  status.textContent =
    "找到 " + matches.length + " 筆資料";

  matches.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const fields = [
      ["停靠地點", item["停留地點"]],
      ["停留時間", item["停留時間"]],
      ["回收日", item["回收日"] ||
                 item["回收日(星期)"]],
      ["行政區", district],
      ["村里", item["村里"]],
      ["車次", item["車次"]]
    ];

    fields.forEach(([label, value]) => {
      const p = document.createElement("p");
      p.textContent =
        label + "：" + (value || "未提供");

      card.appendChild(p);
    });

    results.appendChild(card);
  });
}

loadAllData();
</script>
</body>
</html>
